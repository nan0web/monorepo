title: 'Markdown & MDX Editor'
content:
  - h1: 'Markdown Редактор'
  - p: 'Потужний редактор для форматування довгого тексту (статті, документація).'
  
  - h2: '1. Простий приклад'
  - Markdown: 'Напишіть щось **жирним** шрифтом...'
  
  - h2: '2. Складний приклад (MDX віджети)'
  - blockquote: 'У цій формі текст може містити код або навіть інші OLMUI компоненти (в майбутньому).'
  - Markdown: >
      # Звіт про помилку
      
      Описуємо проблему:
      ```js
      console.error('Crash');
      ```
      
      > Зверніть увагу на логи сервера.
