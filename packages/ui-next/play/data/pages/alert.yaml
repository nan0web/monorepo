title: 'Alert'
content:
  - h1: 'Alert Component'
  - p: 'Alerts are used to display important messages to the user.'
  - Alert: 'This is a success alert, indicating a successful action.'
    $variant: 'success'
  - Alert: 'This is an info alert, used for general information.'
    $variant: 'info'
  - Alert: 'This is a warning alert, pay attention.'
    $variant: 'warn'
  - Alert: 'This is an error alert! Something went wrong.'
    $variant: 'error'
  - Alert: 'This is a default alert, general message without strong emphasis.'
    $variant: 'default'
