title: 'Input: Time & Date'
content:
  - h1: 'Вибір Часу та Дати'
  - p: 'Нативні компоненти для вибору розкладу, планування та дат.'
  
  - h2: '1. Простий вибір часу'
  - Input: '14:00'
    $type: 'time'
    
  - h2: '2. Календар (DatePicker)'
  - Input: ''
    $type: 'date'
    
  - h2: '3. Складний приклад: Заведення Будильника/Таймера'
  - blockquote: 'Уявімо форму створення нагадування. Користувач обирає точний час та дату спрацювання.'
  - Input: '2026-07-21T07:00'
    $type: 'datetime-local'
