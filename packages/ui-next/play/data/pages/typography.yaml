title: 'Typography & Text'
content:
  - h1: 'Типографіка (Data-Driven)'
  - p: 'Тепер текст можна задавати природними HTML-тегами прямо у YAML. Це значно спрощує синтаксис.'
  
  - h2: 'Заголовки'
  - h1: 'h1: Заголовок рівня 1'
  - h2: 'h2: Заголовок рівня 2'
  - h3: 'h3: Заголовок рівня 3'
  - h4: 'h4: Заголовок рівня 4'
  
  - h2: 'Абзаци та стилі'
  - p: 'p: Звичайний абзац тексту, який автоматично відмалюється як Elements.Text.'
  - strong: 'strong: Жирний текст'
  - em: 'em: Курсив'
  - mark: 'mark: Виділений жовтим текст'
  
  - h2: 'Цитати з автором'
  - blockquote: 'Лише той, хто не має справжніх цілей, боїться часу.'
    $author: 'Сковорода'
  
  - h2: 'Просто рядки та Inline-Стилізація'
  - 'Якщо елемент масиву є просто рядком (без ключа), він автоматично перетворюється на абзац тексту. Але можна робити й складніше!'
  - p:
      - 'Це абзац, у якому є '
      - strong: 'жирний текст'
      - ', трохи '
      - em: 'курсиву'
      - ' та навіть '
      - mark: 'маркер'
      - ' для привернення уваги.'
