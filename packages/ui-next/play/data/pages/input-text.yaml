title: 'Input: Text & Numbers'
content:
  - h1: 'Текстові та Числові поля'
  - p: 'Базові компоненти для введення тексту, паролів та чисел.'
  
  - h2: '1. Просте текстове поле'
  - Input: ''
    $type: 'text'
    $placeholder: 'Введіть ваше ім`я...'
    
  - h2: '2. Поле з маскою (Пароль)'
  - p: 'Використовується для конфіденційних даних.'
  - Input: ''
    $type: 'password'
    $placeholder: 'Ваш секретний пароль'
    
  - h2: '3. Числовий лімітований ввід'
  - blockquote: 'Приклад складної форми: вибір віку від 18 до 100.'
  - Input: 18
    $type: 'number'
    $min: 18
    $max: 100
